[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Content-Type = "image/avif"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

# /healthcare-staffing → /healthcare-staffing-houston (force overrides static file)
[[redirects]]
  from = "/healthcare-staffing"
  to = "/healthcare-staffing-houston"
  status = 301
  force = true


# --- Blog (rendered by netlify/functions/blog.mjs from content/blog/*.md) ---
# The function declares its own paths in code: /blog, /blog/*, /sitemap-blog.xml
[functions]
  included_files = ["content/**", "netlify/blog-templates/**"]
  node_bundler = "esbuild"

# Decap CMS admin: keep out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
